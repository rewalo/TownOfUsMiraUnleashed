name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify tag matches VersionPrefix
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $base = $tag.Split('-')[0]
          $props = [xml](Get-Content Directory.Build.props)
          $prefix = ($props.Project.PropertyGroup.VersionPrefix | Select-Object -First 1)
          if ($base -ne $prefix) {
            Write-Error "Tag version '$base' does not match VersionPrefix '$prefix'"
            exit 1
          }
          $suffix = if ($tag.Contains('-')) { $tag.Substring($tag.IndexOf('-') + 1) } else { '' }
          "VERSION_SUFFIX=$suffix" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:ContinuousIntegrationBuild=true "-p:VersionSuffix=${{ env.VERSION_SUFFIX }}"

      - name: Extract changelog section
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) {
            Write-Error "CHANGELOG.md has no '## [$version]' section"
            exit 1
          }
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $section = if ($next) { $rest[0..($next - 2)] } else { $rest }
          $section | Set-Content release-notes.md
          Get-Content release-notes.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: src/MiraUnleashed/bin/Release/net6.0/MiraUnleashed.dll
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
